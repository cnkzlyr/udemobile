name: CanEditor Android APK + Portable Web Release

# v* etiketi gönderilince (masaüstü derlemesiyle aynı anda) APK ve taşınabilir web zip'i üretilip
# aynı GitHub sürümüne eklenir. APK, telefonlardaki kurulumu güncelleyebilmek için HER ZAMAN aynı
# anahtarla imzalanmalıdır; anahtar depo gizlisinden (secret) gelir, yoksa APK yayımlanmaz.
#
# Gerekli depo gizlileri (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_B64   : debug.keystore dosyasının base64 hali  (base64 -w0 debug.keystore)
#   ANDROID_KEYSTORE_PASS  : (isteğe bağlı) anahtar deposu şifresi, varsayılan "android"
#   ANDROID_KEY_ALIAS      : (isteğe bağlı) varsayılan "androiddebugkey"
#   ANDROID_KEY_PASS       : (isteğe bağlı) varsayılan ANDROID_KEYSTORE_PASS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Dosyaların ekleneceği sürüm etiketi (ör. v3.17.0)'
        required: true

jobs:
  build-android:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;35.0.0'

      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Imza anahtari yuklendi."
          else
            echo "::warning::ANDROID_KEYSTORE_B64 gizlisi yok: APK imzalanamaz, yalnizca Portable Web zip yayimlanacak."
          fi

      - name: Build Portable zip + APK
        env:
          CANEDITOR_IMZA_ZORUNLU: '1'
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          # Boş gizliler betiğin varsayılanlarını ezmesin
          [ -n "$ANDROID_KEYSTORE_PASS" ] || unset ANDROID_KEYSTORE_PASS
          [ -n "$ANDROID_KEY_ALIAS" ] || unset ANDROID_KEY_ALIAS
          [ -n "$ANDROID_KEY_PASS" ] || unset ANDROID_KEY_PASS
          set +e
          python3 scripts/pack_release.py
          kod=$?
          set -e
          if [ $kod -eq 2 ] && [ -z "$ANDROID_KEYSTORE" ]; then
            echo "APK atlandi (imza anahtari yok)."
          elif [ $kod -ne 0 ]; then
            exit $kod
          fi
          V="${TAG#v}"
          mkdir -p out
          cp "release/CanEditor-Portable-Web-GUI-v$V.zip" out/
          if [ -n "$ANDROID_KEYSTORE" ]; then
            cp "release/CanEditor-v$V.apk" out/
            cp release/CanEditor-latest.apk out/
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "out/CanEditor-v$V.apk" | grep -i 'SHA-256'
          fi
          ls -l out

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: CanEditor ${{ env.TAG }}
          files: out/*
          fail_on_unmatched_files: false
