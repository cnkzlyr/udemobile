name: CanEditor Cross-Platform Desktop GUI Release

# Tek workflow, tum platformlar: Android APK + Portable Web zip (build-android) ve
# Windows/macOS/Linux (build-desktop). v* etiketinde ya da elle (tag girdisiyle) calisir.
#
# APK HER ZAMAN ayni anahtarla imzalanmali (telefondaki kurulum guncellenebilsin). Depo gizlileri
# (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_B64   : debug.keystore dosyasinin base64 hali  (base64 -w0 debug.keystore)
#   ANDROID_KEYSTORE_PASS  : (istege bagli) varsayilan "android"
#   ANDROID_KEY_ALIAS      : (istege bagli) varsayilan "androiddebugkey"
#   ANDROID_KEY_PASS       : (istege bagli) varsayilan ANDROID_KEYSTORE_PASS
# Gizli yoksa CI APK derlemez; depodaki, yerelde ayni anahtarla imzalanmis release/CanEditor-vX.apk yayimlanir.
# 3.17.0'dan itibaren anahtar: "CN=CanEditor, O=CanEditor, C=TR", SHA-256 BA:80:78:89:...:BB:D4:F0
# (3.16.0 ve oncesi farkli anahtarla imzaliydi; bir kez kaldirip kurmak gerekir).

on:
  push:
    tags:
      - 'v*'
    # Yalniz APK'yi yeniden derleyip mevcut release'e eklemek icin: .github/apk-yayinla dosyasina
    # etiket adini yazip main'e gonderin (masaustu paketleri derlenmez).
    branches:
      - main
    paths:
      - '.github/apk-yayinla'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Surum etiketi (or. v3.17.0); yoksa calistirilan commit uzerinde olusturulur'
        required: true
      masaustu:
        description: 'Masaustu paketleri de derlensin mi? (yalniz APK eklemek icin false)'
        required: false
        default: 'true'

env:
  TAG: ${{ github.event.inputs.tag || (github.ref_type == 'branch' && 'apk-yayinla') || github.ref_name }}

jobs:
  build-android:
    runs-on: ubuntu-22.04
    # Normalde 2-4 dk; takilan bir adim (ag/qemu) yayini saatlerce bekletmesin
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tetik.outputs.tag }}
      tam: ${{ steps.tetik.outputs.tam }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # .github/apk-yayinla: ilk kelime etiket (or. v4.3.1); ikinci kelime "tam" ise masaustu paketleri de derlenir.
      - name: Etiketi tetikleyici dosyadan oku
        id: tetik
        if: github.event_name == 'push' && github.ref_type == 'branch'
        run: |
          read -r T MOD < .github/apk-yayinla || true
          [ -n "$T" ] || { echo "::error::.github/apk-yayinla bos"; exit 1; }
          echo "TAG=$T" >> "$GITHUB_ENV"
          echo "tag=$T" >> "$GITHUB_OUTPUT"
          if [ "$MOD" = "tam" ]; then echo "tam=true" >> "$GITHUB_OUTPUT"; else echo "tam=false" >> "$GITHUB_OUTPUT"; fi
          echo "Yayin: $T (mod: ${MOD:-yalniz-apk})"

      - name: Setup Java 21 (jlink ile Android gömülü Java'sı hazırlanır)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 17: Android sınıfları (D8 uyumu, CANEDITOR_ANDROID_JDK) · 21: jlink (JAVA_HOME, sonda)
          java-version: |
            17
            21

      - name: UYAP Mobil araçları (aarch64 C derleyicisi + readelf)
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu qemu-user  # qemu: Android asistan calisma ortami dogrulamasi

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;35.0.0'

      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Imza anahtari yuklendi."
          else
            # Gizli yoksa APK yine de derlensin: bu calistirma icin yeni anahtar uretilir.
            # Not: anahtar her calistirmada farkli olur; telefonda eski surumu kaldirip kurmak gerekir.
            # Kalici anahtar icin ANDROID_KEYSTORE_B64 gizlisini ekleyin.
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.keystore" -storepass android -keypass android \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=CanEditor, O=CanEditor, C=TR"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "::warning::ANDROID_KEYSTORE_B64 gizlisi yok: APK bu calistirmaya ozel YENI anahtarla imzalandi (eski kurulumun ustune guncellenmez)."
          fi

      - name: Build Portable zip + APK
        env:
          CANEDITOR_IMZA_ZORUNLU: '1'
          CANEDITOR_ANDROID_JDK: ${{ env.JAVA_HOME_17_X64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          # Boş gizliler betiğin varsayılanlarını ezmesin
          [ -n "$ANDROID_KEYSTORE_PASS" ] || unset ANDROID_KEYSTORE_PASS
          [ -n "$ANDROID_KEY_ALIAS" ] || unset ANDROID_KEY_ALIAS
          [ -n "$ANDROID_KEY_PASS" ] || unset ANDROID_KEY_PASS
          set +e
          python3 scripts/pack_release.py
          kod=$?
          set -e
          if [ $kod -eq 2 ] && [ -z "$ANDROID_KEYSTORE" ]; then
            echo "APK CI'da derlenmedi (imza anahtari gizlisi yok); depodaki imzali APK kullanilacak (varsa)."
          elif [ $kod -ne 0 ]; then
            exit $kod
          fi
          V="${TAG#v}"
          mkdir -p out
          cp "release/CanEditor-Portable-Web-GUI-v$V.zip" out/
          # Anahtar gizlisi yoksa: depoya konmus, yerelde ayni anahtarla imzalanmis APK (release/CanEditor-vX.apk)
          # yayimlanir. git checkout, derleme betiginin uzerine yazdigi dosyayi depodaki haline dondurur.
          if [ -z "$ANDROID_KEYSTORE" ]; then git checkout -- release/ 2>/dev/null || true; fi
          if [ -f "release/CanEditor-v$V.apk" ]; then
            cp "release/CanEditor-v$V.apk" out/
            cp "release/CanEditor-v$V.apk" out/CanEditor-latest.apk
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "out/CanEditor-v$V.apk" | grep -i 'SHA-256'
          else
            echo "::warning::release/CanEditor-v$V.apk yok: APK yayimlanmadi."
          fi
          ls -l out

      # Sürüm notları docs/surum-notlari/<etiket>.md'den (README'deki sürüm bölümüyle aynı içerik); yoksa kısa not.
      - name: Surum notlari
        run: |
          f="docs/surum-notlari/${TAG}.md"
          if [ -f "$f" ]; then cp "$f" "$RUNNER_TEMP/notlar.md"; else echo "CanEditor ${TAG}" > "$RUNNER_TEMP/notlar.md"; fi

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: CanEditor ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ runner.temp }}/notlar.md
          files: out/*
          fail_on_unmatched_files: false

  # v4.10.0: platform/eimza-one (Android surucusuz e-imza) APK'si her CanEditor surumune eklenir.
  # Basarisiz olsa da masaustu/Android paketlerini engellemez (continue-on-error).
  eimza-one:
    needs: build-android
    if: ${{ always() && needs.build-android.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    permissions:
      contents: write
    env:
      TAG: ${{ needs.build-android.outputs.tag || github.event.inputs.tag || github.ref_name }}
    defaults:
      run:
        working-directory: platform/eimza-one
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Surucu testleri + APK
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          K_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle wrapper --gradle-version 8.10.2 && chmod +x gradlew tools/*.sh
          for t in tools/test-*.sh; do echo "== $t"; bash "$t"; done
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/eo.keystore"
            export KEYSTORE_FILE="$RUNNER_TEMP/eo.keystore" KEYSTORE_PASSWORD="$KS_PASS" KEY_ALIAS="$KS_ALIAS" KEY_PASSWORD="$K_PASS"
          else
            keytool -genkeypair -keystore "$RUNNER_TEMP/eo.jks" -alias eimzaone -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass eimzaone123 -keypass eimzaone123 -dname "CN=E-Imza One, O=CanEditor, C=TR"
            export KEYSTORE_FILE="$RUNNER_TEMP/eo.jks" KEYSTORE_PASSWORD=eimzaone123 KEY_ALIAS=eimzaone KEY_PASSWORD=eimzaone123
          fi
          ./gradlew assembleRelease --stacktrace
          V=$(grep versionName app/build.gradle | head -1 | sed "s/.*['\"]\(.*\)['\"].*/\1/")
          mkdir -p "$GITHUB_WORKSPACE/eo-dist"
          cp "$(find app/build/outputs/apk/release -name '*.apk' | head -1)" "$GITHUB_WORKSPACE/eo-dist/E-Imza-One-v${V}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: eo-dist/*.apk
          fail_on_unmatched_files: false

  build-desktop:
    # Surumu Android isi olusturur (etiket yoksa github.sha uzerinde); masaustu ayni surume ekler.
    needs: build-android
    if: ${{ always() && ((!(github.event_name == 'push' && github.ref_type == 'branch') && github.event.inputs.masaustu != 'false') || needs.build-android.outputs.tam == 'true') }}
    permissions:
      contents: write
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
      NO_STRIP: "true"
      ARCH: "x86_64"
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin --ignore-version-mismatches'
          - platform: 'ubuntu-22.04'
            args: '--verbose --ignore-version-mismatches'
          - platform: 'windows-latest'
            args: '--ignore-version-mismatches'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Etiketi Android isinden al (dosya tetiklemeli yayin)
        if: github.event_name == 'push' && github.ref_type == 'branch'
        shell: bash
        run: echo "TAG=${{ needs.build-android.outputs.tag }}" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf rpm libfuse2

      - name: Install Root Dependencies
        run: npm install

      - name: Install Frontend Dependencies & Build
        working-directory: frontend
        run: |
          npm install
          npm run build

      # Kullanici Java, Python veya kart surucusu KURMAZ: hepsi kurulum paketine gomulur.
      #  - Gomulu Java (jlink): resmi Adalet E-Imza'yi calistirir; kart PC/SC + isletim sisteminin kendi CCID
      #    surucusuyle, karta dogrudan APDU ile okunur (AKIS/ArkSigner PKCS#11 surucusu gerekmez).
      #    Linux .deb/.rpm: pcscd + CCID paket bagimliligi olarak otomatik kurulur (tauri.linux.conf.json).
      #  - Hukuk Asistani sunucusu (PyInstaller): UETS, UYAP evrak, A4 motoru Python'suz calisir.
      - name: Setup Java 21 (gomulu Java icin jlink)
        id: java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Python 3.12 (asistan sunucusu paketleme)
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Gomulu Java + Hukuk Asistani sunucusu (bu mimari)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r asistan/requirements.txt pyinstaller
          PYTHONUTF8=1 PYTHONIOENCODING=utf-8 python scripts/masaustu_hazirla.py --java-home "${{ steps.java.outputs.path }}"

      - name: Linux ldconfig for embedded Java (libjvm.so linuxdeploy fix)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          echo "${{ steps.java.outputs.path }}/lib/server" | sudo tee /etc/ld.so.conf.d/java-jvm.conf
          echo "${{ steps.java.outputs.path }}/lib" | sudo tee -a /etc/ld.so.conf.d/java-jvm.conf
          echo "$PWD/src-tauri/eimza/jre/lib/server" | sudo tee -a /etc/ld.so.conf.d/java-jvm.conf
          echo "$PWD/src-tauri/eimza/jre/lib" | sudo tee -a /etc/ld.so.conf.d/java-jvm.conf
          sudo ldconfig
          ldconfig -p | grep libjvm || true

      # macOS universal paket Intel Mac'lerde de calismali: Java ve sunucu x86_64 icin de uretilir (Rosetta).
      - name: Setup Java 21 x64 (macOS Intel)
        if: matrix.platform == 'macos-latest'
        id: java_x64
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          architecture: x64

      - name: Setup Python 3.12 x64 (macOS Intel)
        if: matrix.platform == 'macos-latest'
        id: python_x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Gomulu Java + Hukuk Asistani sunucusu (macOS x86_64)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          PY="${{ steps.python_x64.outputs.python-path }}"
          # macOS runner izole venv: host arm64 paketlerinin sızmasını önler
          arch -x86_64 "$PY" -m venv "$RUNNER_TEMP/venv-x64"
          source "$RUNNER_TEMP/venv-x64/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install -r asistan/requirements.txt pyinstaller
          PYTHONUTF8=1 PYTHONNOUSERSITE=1 python scripts/masaustu_hazirla.py --java-home "${{ steps.java_x64.outputs.path }}" --mimari x86_64
          deactivate
          file src-tauri/sidecar/asistan-sunucu-x86_64/asistan-sunucu | grep -q x86_64
          file src-tauri/sidecar/asistan-sunucu-aarch64/asistan-sunucu | grep -q arm64

      - name: Windows Unicode PC/SC ajani (Turkce okuyucu adlari, ArkSigner)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          PYTHONUTF8=1 python scripts/win_ajan_derle.py
          test -f src-tauri/eimza/eimza-win-agent.jar
          # Duman testi: ajan winscard.dll'i yukleyebiliyor mu (CI'da akilli kart hizmeti olmayabilir; hata derlemeyi durdurmaz)
          src-tauri/eimza/jre/bin/java.exe -javaagent:src-tauri/eimza/eimza-win-agent.jar -version 2>&1 | grep -E "CANEDITOR-PCSC|version" || true

      - name: Build Desktop Application (Tauri Action)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: "true"
          ARCH: "x86_64"
          LD_LIBRARY_PATH: "${{ steps.java.outputs.path }}/lib/server:${{ steps.java.outputs.path }}/lib:/home/runner/work/udemobile/udemobile/src-tauri/eimza/jre/lib/server:/home/runner/work/udemobile/udemobile/src-tauri/eimza/jre/lib"
        with:
          tagName: ${{ env.TAG }}
          releaseName: 'CanEditor ${{ env.TAG }}'
          releaseCommitish: ${{ github.sha }}
          releaseBody: |
            CanEditor ${{ env.TAG }} — Birleşik Hukuk Platformu & Çapraz Platform UYAP Editörü.

            Tüm platform paketleri (Windows `.exe`/`.msi`, macOS Universal `.dmg`, Linux `.deb`/`.rpm`/`.AppImage`, Android `.apk`, Taşınabilir Web `.zip`) kurulum gerektirmeden gömülü Python, Java, görünmez Chrome ve sürücüsüz e-İmza altyapısını içerir.
            - Tek uygulama: CanEditor (UYAP Dosyalarım, Google Drive Veritabanı İndeksi, Notion & TickTick, Resmî Havelsan JAR Dönüştürme, HAYFA İçtihat/Haber/Resmî Gazete/Çevrimdışı Adliye & IBAN, 7 Hukuk Hesaplayıcısı)
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
