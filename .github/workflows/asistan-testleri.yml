# Birleşik Hukuk Asistanı: sunucu + taşınan modüllerin (UETS asistanı, UYAP evrak, A4 motoru, Termux) testleri
# ve arayüz asistanının (asistan.js) Python referansıyla süre-hesabı eşdeğerlik testi.
name: Asistan Testleri

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Bağımlılıklar
        run: |
          pip install -r asistan/requirements.txt pytest pyflakes
          sudo apt-get install -y shellcheck
      - name: Tanımsız isim denetimi (pyflakes)
        run: |
          pyflakes $(git ls-files 'asistan/*.py') | tee pyflakes.txt || true
          ! grep -E "undefined name|referenced before assignment" pyflakes.txt
      - name: Asistan sunucusu (güvenlik + iki modülün gerçek şemasıyla uçtan uca)
        run: python -m unittest discover -s asistan/testler -v
      - name: Avukat Asistanı (UETS) testleri
        working-directory: asistan/moduller/avukatasistan
        run: python -m pytest -q tests
      - name: Arayüz asistanı — süre hesabı Python ile birebir, A4 yerleşimi
        run: node --test tests/*.test.cjs
        env:
          TZ: Europe/Istanbul
      - name: Termux paketi — kabuk, Python, e-imza köprüsü, Java testleri
        working-directory: platform/termux
        run: |
          shellcheck -S warning $(git ls-files '*.sh') bilesenler/uyap
          python3 -m unittest discover -s testler -v
          python3 -I bilesenler/eimza/selftest.py
          bash testler/java_testleri.sh
