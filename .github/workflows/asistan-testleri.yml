# Birleşik Hukuk Asistanı: sunucu + taşınan modüllerin (UETS asistanı, UYAP evrak, A4 motoru, Termux) testleri
# ve arayüz asistanının (asistan.js) Python referansıyla süre-hesabı eşdeğerlik testi.
name: Asistan Testleri

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Bağımlılıklar
        run: |
          pip install -r asistan/requirements.txt pytest pyflakes
          sudo apt-get install -y shellcheck
      - name: Tanımsız isim denetimi (pyflakes)
        run: |
          pyflakes $(git ls-files 'asistan/*.py') | tee pyflakes.txt || true
          ! grep -E "undefined name|referenced before assignment" pyflakes.txt
      - name: Asistan sunucusu (güvenlik + iki modülün gerçek şemasıyla uçtan uca)
        run: python -m unittest discover -s asistan/testler -v
      - name: Avukat Asistanı (UETS) testleri
        working-directory: asistan/moduller/avukatasistan
        run: python -m pytest -q tests
      - name: Arayüz asistanı — süre hesabı Python ile birebir, A4 yerleşimi
        run: node --test tests/*.test.cjs
        env:
          TZ: Europe/Istanbul
      - name: Termux paketi — kabuk, Python, e-imza köprüsü, Java testleri
        working-directory: platform/termux
        run: |
          shellcheck -S warning $(git ls-files '*.sh') bilesenler/uyap
          python3 -m unittest discover -s testler -v
          python3 -I bilesenler/eimza/selftest.py
          bash testler/java_testleri.sh

  gomulu-paket:
    # Masaüstü paketine giren Python'suz sunucu ikilisi: her import ve görev betiği Python'suz ortamda yüklenmeli
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Gömülü Java + sunucu ikilisi (paketleme ve duman testi)
        run: |
          pip install -r asistan/requirements.txt pyinstaller
          python scripts/masaustu_hazirla.py

  android-calisma-ortami:
    # Android (Termux'suz): APK'ya giren CPython + tekerlekler + Termux glibc; Android'deki başlatma
    # komutunun aynısıyla (glibc yükleyicisi + --library-path) qemu-aarch64 altında import ve sunucu testi
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y qemu-user binutils
      - name: Android asistan çalışma ortamı (hazırla + qemu doğrulaması)
        run: python scripts/asistan_android_hazirla.py
      - uses: actions/upload-artifact@v4
        with:
          name: asistan-rt-arm64
          path: build/asistan-android/asistan-rt-arm64.zip
