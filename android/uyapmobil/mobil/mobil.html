<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
/* UYAP Editör — anlık mobil görünüm: resmi editörün belleğindeki belge, telefon genişliğinde satır kırılarak. */
:root{--g:.45;--olcek:1}
html,body{margin:0;background:#e8eaed;-webkit-text-size-adjust:none}
body{font-family:'Times New Roman','Liberation Serif',serif;color:#202124}
#kagit{background:#fff;margin:10px 8px 120px;padding:18px 16px 28px;border-radius:10px;
  box-shadow:0 1px 3px rgba(60,64,67,.15),0 4px 12px rgba(60,64,67,.08);font-size:calc(12pt*var(--olcek));
  line-height:1.38;word-wrap:break-word;overflow-wrap:anywhere;transition:opacity .15s}
#kagit p{margin:0;white-space:pre-wrap;tab-size:3;-moz-tab-size:3;min-height:1em}
#kagit span{font-size:inherit}
#kagit span[style*="font-size"]{font-size:unset}
#kagit img{max-width:100%;height:auto !important;vertical-align:middle}
#kagit header,#kagit footer{display:block;color:#5f6368;font-size:.9em}
#kagit header{border-bottom:1px dashed #dadce0;padding-bottom:8px;margin-bottom:12px}
#kagit footer{border-top:1px dashed #dadce0;padding-top:8px;margin-top:16px}
#kagit table{border-collapse:collapse;width:100%;margin:6px 0}
#kagit td{border:1px solid #9aa0a6;padding:4px 6px;vertical-align:top}
#imlec{position:absolute;width:2px;background:#1a73e8;border-radius:1px;pointer-events:none;animation:yanip 1.05s steps(1) infinite;z-index:5}
@keyframes yanip{50%{opacity:0}}
::selection{background:rgba(26,115,232,.28)}
/* ---- kağıt görünümü: motorun satır/kelime konumları, punto = px, sayfa ölçeği --s ---- */
body.kagit #kagit{display:none}
#sayfalar{display:none;padding:12px 0 140px}
body.kagit #sayfalar{display:block}
.sayfa{position:relative;background:#fff;margin:0 auto 14px;box-shadow:0 1px 3px rgba(60,64,67,.18),0 6px 16px rgba(60,64,67,.10);
  transform-origin:0 0;overflow:hidden}
.kap{position:relative;margin:0 auto 14px}
.sayfa .w{position:absolute;white-space:pre;font-family:'Times New Roman','Liberation Serif',serif;color:#202124}
.sayfa .w.sec{background:rgba(26,115,232,.28)}
.sayfa img{position:absolute}
.sayfa .ust,.sayfa .alt{opacity:.92}
#kimlec{position:absolute;width:1.6px;background:#1a73e8;pointer-events:none;animation:yanip 1.05s steps(1) infinite;z-index:5;display:none}

</style></head>
<body><div id="kagit"></div><div id="sayfalar"></div><div id="imlec" style="display:none"></div>
<script>
// Köprü: Android → içerik(html, imleç, seçimSonu), imlec(a,b), resim(no, png)
var R={}, kagit=document.getElementById('kagit'), imlecEl=document.getElementById('imlec'), sonA=-1, sonB=-1, ilk=true;
function resim(no,png){R[no]='data:image/png;base64,'+png;var l=kagit.querySelectorAll('img[data-r="'+no+'"]');for(var i=0;i<l.length;i++)l[i].src=R[no];}
function icerik(h,a,b){ kagitKip(false);
  var y=window.scrollY; kagit.innerHTML=h;
  var l=kagit.querySelectorAll('img[data-r]');for(var i=0;i<l.length;i++){var r=R[l[i].getAttribute('data-r')];if(r)l[i].src=r;}
  // yazı boyutları ölçekle: pt değerlerini telefon için oranla
  var s=kagit.querySelectorAll('span[style*="font-size"]');for(var i=0;i<s.length;i++){var m=/font-size:\s*([\d.]+)pt/.exec(s[i].getAttribute('style'));if(m)s[i].style.fontSize='calc('+m[1]+'pt*var(--olcek))';}
  window.scrollTo(0,y); imlec(a,b, ilk); ilk=false;
}
function konum(o){ // karakter konumu → DOM aralığı
  var el=null, l=kagit.querySelectorAll('[data-o]'), best=null;
  for(var i=0;i<l.length;i++){var v=+l[i].getAttribute('data-o'); if(v<=o && l[i].tagName!=='P'){best=l[i];} if(v>o)break;}
  if(!best){var p=kagit.querySelector('p'); if(!p)return null; var r=document.createRange(); r.setStart(p,0); return r;}
  var r=document.createRange(), d=o-(+best.getAttribute('data-o'));
  if(best.tagName==='IMG'){ if(d>0) r.setStartAfter(best); else r.setStartBefore(best); return r;}
  var t=best.firstChild; if(!t){r.setStart(best,0);return r;}
  var n=t.textContent.length; if(d>n){ r.setStartAfter(best); } else r.setStart(t,Math.max(0,d)); return r;
}
function imlec(a,b,kaydir){
  sonA=a; sonB=b; var sel=window.getSelection(); sel.removeAllRanges();
  if(a!==b && a>=0 && b>=0){ var r1=konum(Math.min(a,b)), r2=konum(Math.max(a,b)); if(r1&&r2){var r=document.createRange(); r.setStart(r1.startContainer,r1.startOffset); r.setEnd(r2.startContainer,r2.startOffset); sel.addRange(r);} imlecEl.style.display='none'; return;}
  var r=konum(b); if(!r){imlecEl.style.display='none';return;}
  var k=r.getClientRects(); var c=k.length?k[0]:(r.startContainer.nodeType===1?r.startContainer.getBoundingClientRect():r.startContainer.parentNode.getBoundingClientRect());
  imlecEl.style.display='block'; imlecEl.style.left=(c.left+window.scrollX)+'px'; imlecEl.style.top=(c.top+window.scrollY)+'px'; imlecEl.style.height=Math.max(14,c.height||18)+'px';
  if(kaydir){ imlecEl.scrollIntoView({block:'center'}); }
  else { var y=c.top; if(y<70||y>window.innerHeight-220) window.scrollBy({top:y-window.innerHeight/3,behavior:'smooth'}); }
}
function ofset(node,off){ // DOM → karakter konumu
  var e=node.nodeType===3?node.parentNode:node;
  while(e&&e!==kagit&&!e.hasAttribute('data-o'))e=e.parentNode;
  if(!e||e===kagit)return -1;
  var o=+e.getAttribute('data-o'); if(e.tagName==='P'){ // paragraf boşluğu: sonuna
    var son=e.lastElementChild; if(son&&son.hasAttribute('data-o')){return +son.getAttribute('data-o')+(son.tagName==='IMG'?1:son.textContent.length);} return o;}
  return o+(node.nodeType===3?off:0);
}
document.addEventListener('click',function(ev){ if(document.body.classList.contains('kagit'))return;
  var r=document.caretRangeFromPoint?document.caretRangeFromPoint(ev.clientX,ev.clientY):null;
  if(!r)return; var o=ofset(r.startContainer,r.startOffset); if(o>=0&&window.K)K.imlec(o,-1);
});
var secZ=null;
document.addEventListener('selectionchange',function(){
  var s=window.getSelection(); if(!s.rangeCount||s.isCollapsed)return; var r=s.getRangeAt(0);
  clearTimeout(secZ); secZ=setTimeout(function(){var a=ofset(r.startContainer,r.startOffset),b=ofset(r.endContainer,r.endOffset); if(a>=0&&b>=0&&window.K&&(a!==Math.min(sonA,sonB)||b!==Math.max(sonA,sonB)))K.imlec(a,b);},350);
});
function olcek(k){document.documentElement.style.setProperty('--olcek',k); if(KD&&document.body.classList.contains('kagit'))kagitOlcek(k);}
function mobilKip(){kagitKip(false);}
// ======================================================================= kağıt görünümü
var KD=null, kOlcek=1, kSec=[-1,-1], kImlec=null;
function kSayfaOlcek(){ return Math.max(0.2,(window.innerWidth-12)/KD.pw)*kOlcek; }
function kagitKip(ac){ document.body.classList.toggle('kagit',!!ac); }
function kagitCiz(js,a,b,cx,cy,ch){
  var d=JSON.parse(js); KD=d; kagitKip(true);
  var kok=document.getElementById('sayfalar'), y0=window.scrollY; kok.innerHTML='';
  var sc=kSayfaOlcek(), sayfalar=[];
  for(var k=0;k<d.n;k++){
    var kap=document.createElement('div'); kap.className='kap'; kap.style.width=(d.pw*sc)+'px'; kap.style.height=(d.ph*sc)+'px';
    var s=document.createElement('div'); s.className='sayfa'; s.style.width=d.pw+'px'; s.style.height=d.ph+'px'; s.style.transform='scale('+sc+')';
    s.dataset.k=k; kap.appendChild(s); kok.appendChild(kap); sayfalar.push(s);
  }
  var son=(d.n-1)*d.pitch;
  function ekle(s,ly,lh,p,ust){
    for(var i=0;i<p.length;i++){var q=p[i], e=document.createElement('span');
      e.className='w'+(ust?' '+ust:''); e.textContent=q[3]; e.dataset.o=q[2]; e.dataset.n=q[3].length;
      var fs=q[5]||12, lb=fs*1.17; e.style.cssText=q[4]+'left:'+(q[0]-d.px)+'px;top:'+(ly+lh-lb-fs*0.06)+'px;font-size:'+fs+'px;line-height:'+lb+'px;';
      s.appendChild(e);}
  }
  for(var i=0;i<d.L.length;i++){
    var L=d.L[i], y=L[0], h=L[1], bolge=L[2];
    if(bolge===0){ var k=Math.min(d.n-1,Math.max(0,Math.floor(y/d.pitch))); ekle(sayfalar[k], y-k*d.pitch, h, L[3]); }
    else { var ry = bolge===1 ? y : y-son; for(var k=0;k<d.n;k++) ekle(sayfalar[k], ry, h, L[3], bolge===1?'ust':'alt'); }
  }
  for(var i=0;i<d.I.length;i++){
    var q=d.I[i], bolge=q[5];
    var hedef = bolge===0 ? [Math.min(d.n-1,Math.floor(q[1]/d.pitch))] : sayfalar.map(function(_,k){return k;});
    for(var j=0;j<hedef.length;j++){ var k=hedef[j], im=document.createElement('img');
      var ry = bolge===0 ? q[1]-k*d.pitch : (bolge===1 ? q[1] : q[1]-son);
      im.style.cssText='left:'+(q[0]-d.px)+'px;top:'+ry+'px;width:'+q[2]+'px;height:'+q[3]+'px';
      im.dataset.r=q[4]; if(R[q[4]]) im.src=R[q[4]]; sayfalar[k].appendChild(im); }
  }
  var ic=document.createElement('div'); ic.id='kimlec'; kok.appendChild(ic);
  window.scrollTo(0,y0); kimlec(a,b,cx,cy,ch, ilk); ilk=false;
}
function kMotor(x,y,k){ return [Math.round(x+KD.px), Math.round(k*KD.pitch+y)]; }
function kNokta(ev){ // ekran → motor koordinatı
  var el=document.elementFromPoint(ev.clientX,ev.clientY); while(el&&!(el.classList&&el.classList.contains('kap')))el=el.parentNode;
  if(!el)return null; var s=el.firstChild, r=el.getBoundingClientRect(), sc=kSayfaOlcek();
  return kMotor((ev.clientX-r.left)/sc,(ev.clientY-r.top)/sc,+s.dataset.k);
}
function kimlec(a,b,cx,cy,ch,kaydir){
  if(!KD)return; kSec=[Math.min(a,b),Math.max(a,b)];
  var l=document.querySelectorAll('#sayfalar .w');
  for(var i=0;i<l.length;i++){var o=+l[i].dataset.o, n=+l[i].dataset.n; l[i].classList.toggle('sec', a!==b && o+n>kSec[0] && o<kSec[1]);}
  var ic=document.getElementById('kimlec'); if(!ic)return;
  if(a!==b || cx===undefined || cx===null){ ic.style.display='none'; return; }
  var k=Math.min(KD.n-1,Math.max(0,Math.floor(cy/KD.pitch))), kap=document.querySelectorAll('#sayfalar .kap')[k]; if(!kap)return;
  var sc=kSayfaOlcek(); ic.style.display='block';
  ic.style.left=(kap.offsetLeft+(cx-KD.px)*sc)+'px'; ic.style.top=(kap.offsetTop+(cy-k*KD.pitch)*sc)+'px'; ic.style.height=Math.max(10,ch*sc)+'px';
  var r=ic.getBoundingClientRect();
  if(kaydir) ic.scrollIntoView({block:'center'});
  else if(r.top<70||r.bottom>window.innerHeight-200) window.scrollBy({top:r.top-window.innerHeight/3,behavior:'smooth'});
}
function kagitOlcek(k){ kOlcek=k; if(KD){ var d=JSON.stringify(KD); kagitCiz(d,kSec[0],kSec[1]); } }
// dokunma: tek dokunuş imleç, uzun basıp sürükleme seçim (her iki kipte)
var bas=null, uzun=false, uzunZ=null, sonGon=0;
function noktaGonder(p1,p2){ if(!window.K)return; if(p2) K.nokta(p1[0],p1[1],p2[0],p2[1]); else K.nokta(p1[0],p1[1],-1,-1); }
document.addEventListener('touchstart',function(ev){ if(ev.touches.length!==1){bas=null;return;} var t=ev.touches[0]; bas={x:t.clientX,y:t.clientY,t:Date.now()}; uzun=false;
  clearTimeout(uzunZ); uzunZ=setTimeout(function(){ if(!bas)return; uzun=true; if(navigator.vibrate)navigator.vibrate(12);
    if(KD&&document.body.classList.contains('kagit')){ bas.m=kNokta({clientX:bas.x,clientY:bas.y}); if(bas.m) noktaGonder(bas.m); }
    else { var r=document.caretRangeFromPoint(bas.x,bas.y); if(r){ bas.o=ofset(r.startContainer,r.startOffset); } } },420);
},{passive:true});
document.addEventListener('touchmove',function(ev){ if(!bas)return; var t=ev.touches[0];
  if(!uzun){ if(Math.abs(t.clientX-bas.x)>10||Math.abs(t.clientY-bas.y)>10){clearTimeout(uzunZ);bas=null;} return; }
  ev.preventDefault(); if(Date.now()-sonGon<90)return; sonGon=Date.now();
  if(KD&&document.body.classList.contains('kagit')){ var m=kNokta({clientX:t.clientX,clientY:t.clientY}); if(bas.m&&m) noktaGonder(bas.m,m); }
  else { var r=document.caretRangeFromPoint(t.clientX,t.clientY); if(r&&bas.o>=0){ var o=ofset(r.startContainer,r.startOffset); if(o>=0&&window.K) K.imlec(bas.o,o);} }
},{passive:false});
document.addEventListener('touchend',function(ev){ clearTimeout(uzunZ); if(!bas)return; var b=bas; bas=null; if(uzun)return;
  if(Date.now()-b.t>400)return;
  if(KD&&document.body.classList.contains('kagit')){ var m=kNokta({clientX:b.x,clientY:b.y}); if(m) noktaGonder(m); ev.preventDefault(); }
},{passive:false});

</script></body></html>
