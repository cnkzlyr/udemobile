plugins {
    id 'com.android.application'
}

def firebaseEnabled = project.findProperty('firebaseEnabled') == 'true'
        && rootProject.file('app/google-services.json').exists()
if (firebaseEnabled) {
    apply plugin: 'com.google.gms.google-services'
    apply plugin: 'com.google.firebase.crashlytics'
}

android {
    namespace 'app.eimza.mobile'
    compileSdk 34

    defaultConfig {
        applicationId 'app.eimza.mobile'
        minSdk 26
        targetSdk 34
        versionCode 36
        versionName '0.3.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("KEYSTORE_FILE")
            def ksFile = ksPath ? file(ksPath) : null
            if (ksFile != null && ksFile.exists()) {
                storeFile ksFile
                storePassword(System.getenv("KEYSTORE_PASSWORD") ?: "eimzaone123")
                keyAlias(System.getenv("KEY_ALIAS") ?: "eimzaone")
                keyPassword(System.getenv("KEY_PASSWORD") ?: "eimzaone123")
            } else {
                initWith(signingConfigs.debug)
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        resources {
            excludes += [
                'META-INF/versions/9/OSGI-INF/MANIFEST.MF',
                'META-INF/versions/11/OSGI-INF/MANIFEST.MF',
                'META-INF/versions/15/OSGI-INF/MANIFEST.MF',
                'META-INF/*.SF',
                'META-INF/*.DSA',
                'META-INF/*.RSA',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/DEPENDENCIES'
            ]
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    if (firebaseEnabled) {
        implementation platform('com.google.firebase:firebase-bom:35.0.0')
        implementation 'com.google.firebase:firebase-analytics'
        implementation 'com.google.firebase:firebase-crashlytics'
    }
}
