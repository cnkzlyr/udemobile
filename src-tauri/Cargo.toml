[package]
name = "can-editor"
version = "3.18.0"
description = "CanEditor - Cross-Platform UYAP & Word Editor"
authors = ["Can Kızılyar"]
edition = "2021"

[lib]
name = "can_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "8.6.0"
tauri-plugin-dialog = "2"
base64 = "0.22"
ureq = { version = "2", default-features = false }
cryptoki = "0.7"
